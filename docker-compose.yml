services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: platform
    volumes:
      - platform_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  platform:
    build:
      context: .
      dockerfile: web/platform/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://nova:nova@db:5432/platform
      SCHEMA_PATH: /app/schema.sql
    depends_on:
      db:
        condition: service_healthy

volumes:
  platform_db:
